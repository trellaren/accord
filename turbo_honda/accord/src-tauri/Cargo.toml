[package]
name = "accord"
version = "0.1.0"
description = "Accord – Turbo Honda: P2P Group VoIP & Video/Text Desktop App"
authors = ["trellaren"]
edition = "2021"

[lib]
name = "accord_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "accord"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# P2P networking
libp2p = { version = "0.55", features = [
    "tokio",
    "tcp",
    "noise",
    "yamux",
    "mdns",
    "gossipsub",
    "identify",
    "ping",
    "macros",
] }

futures = "0.3"

# Pin hickory-proto to the alpha that ships `tokio-runtime` feature.
# libp2p-dns 0.43 uses hickory-resolver 0.25.0-alpha.4, which in turn requires
# hickory-proto with `tokio-runtime`.  The stable 0.25.2 renamed that feature to
# `tokio`, causing a resolution failure.  Pinning here keeps the whole tree on the
# compatible pre-release while still satisfying libp2p-mdns (^0.25.0-alpha.4).
hickory-proto = "=0.25.0-alpha.4"

# WebRTC for audio/video (media streams)
webrtc = { version = "0.12", optional = true }

# Camera capture via nokhwa (cross-platform: v4l2 / DirectShow / AVFoundation)
nokhwa = { version = "0.10", features = ["input-native"], optional = true }

# Audio capture/playback
cpal = "0.15"

# Opus audio codec (encoding / decoding for VoIP)
audiopus = "0.2"

# Logging
log = "0.4"
env_logger = "0.11"

# UUIDs for peer / channel IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Anyhow for ergonomic error handling
anyhow = "1"

# SQLite persistence via sqlx
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }

# Async channels
async-channel = "2"

[features]
# Include WebRTC video support when this feature is enabled
video = ["dep:webrtc", "dep:nokhwa"]
# Default build without optional heavy deps so the scaffold compiles quickly
default = []

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
